services:
  - type: web
    name: reyescompany-backend
    runtime: docker
    rootDir: backend
    plan: free
    branch: main
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
